<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Salmo</title>
  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #1e293b, #0f172a);
      color: white;
      font-family: 'Georgia', serif;
      text-align: center;
      padding: 50px;
      line-height: 1.8;
      position: relative;
      height: 100vh;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
    }

    #salmo {
      font-size: 1.3em;
      font-weight: bold;
      display: inline-block;
      white-space: pre-wrap;
      overflow: hidden;
      border-right: .15em solid rgba(255,255,255,0.6);
      letter-spacing: .05em;

      /* Efeito celestial */
      background: linear-gradient(270deg, #fff 0%, #a5f3fc 25%, #f0abfc 50%, #fde68a 75%, #fff 100%);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 16px rgba(255,255,255,0.4);
      animation: gradientMove 8s ease infinite, pulse 3s ease-in-out infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 16px rgba(255,255,255,0.4); }
      50% { text-shadow: 0 0 16px rgba(255,255,255,0.9), 0 0 32px rgba(255,255,255,0.6); }
    }

    .next-link {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: none; /* só aparece depois */
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 12px 16px;
      border-radius: 50%;
      text-decoration: none;
      font-size: 1.5em;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
      transition: all 0.3s ease;
      animation: pulsar 1.5s infinite;
    }

    @keyframes pulsar {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.4); }
      50% { transform: scale(1.2); box-shadow: 0 0 20px rgba(255,255,255,0.8); }
      100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.4); }
    }

    .next-link:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <h1>✨ Mensagem do Dia: ✨</h1>
  <div id="salmo"></div>

  <!-- botão flutuante -->
  <a href="cashflow.html" class="next-link" id="btnProximo">➡️</a>

  <!-- música ambiente -->
  <audio id="musicaFundo" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c9c7a3a0e2.mp3?filename=gentle-harp-ambient-11099.mp3" type="audio/mpeg">
  </audio>

  <script>
    const salmos = [
      "O Senhor é o meu pastor, nada me faltará. (Salmo 23:1)",
      "Entrega o teu caminho ao Senhor; confia nele, e o mais ele fará. (Salmo 37:5)",
      "Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia. (Salmo 46:1)",
      "Bem-aventurado o homem que não anda segundo o conselho dos ímpios. (Salmo 1:1)",
      "O Senhor é a minha luz e a minha salvação; a quem temerei? (Salmo 27:1)",
      "Aquietai-vos e sabei que eu sou Deus. (Salmo 46:10)",
      "Cria em mim, ó Deus, um coração puro e renova em mim um espírito inabalável. (Salmo 51:10)",
      "A tua palavra é lâmpada para os meus pés e luz para o meu caminho. (Salmo 119:105)",
      "O choro pode durar uma noite, mas a alegria vem pela manhã. (Salmo 30:5)",
      "Clama a mim no dia da angústia; eu te livrarei, e tu me glorificarás. (Salmo 50:15)",
      "Os que confiam no Senhor são como o monte Sião, que não se abala, firme para sempre. (Salmo 125:1)",
      "Grandes coisas fez o Senhor por nós, pelas quais estamos alegres. (Salmo 126:3)",
      "Examina-me, Senhor, e prova-me; sonda o meu coração e os meus pensamentos. (Salmo 26:2)",
      "O Senhor é bom, um refúgio em tempos de angústia. Ele protege os que nele confiam. (Salmo 34:8)",
      "Ensina-nos a contar os nossos dias, para que alcancemos coração sábio. (Salmo 90:12)",
      "Sonda-me, ó Deus, e conhece o meu coração; prova-me e conhece as minhas inquietações. (Salmo 139:23)",
      "Espera no Senhor, anima-te, e ele fortalecerá o teu coração. (Salmo 27:14)",
      "O Senhor guarda a tua entrada e a tua saída, desde agora e para sempre. (Salmo 121:8)",
      "Bem-aventurados os que habitam na tua casa; louvam-te perpetuamente. (Salmo 84:4)",
      "Cantai ao Senhor um cântico novo, porque ele tem feito maravilhas. (Salmo 98:1)"
    ];

    function carregarSalmo() {
      const index = Math.floor(Math.random() * salmos.length);
      const texto = salmos[index];
      const elemento = document.getElementById("salmo");
      elemento.textContent = "";
      let i = 0;

      function escrever() {
        if (i < texto.length) {
          elemento.textContent += texto.charAt(i);
          i++;
          setTimeout(escrever, 60); // velocidade da digitação
        } else {
          // quando terminar, mostra o botão
          document.getElementById("btnProximo").style.display = "inline-block";
        }
      }

      escrever();
    }

    carregarSalmo();

    // parar a música ao clicar no botão
    document.getElementById("btnProximo").addEventListener("click", () => {
      const musica = document.getElementById("musicaFundo");
      musica.pause();
      musica.currentTime = 0;
    });
  </script>
</body>
</html>
