<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salmo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a2a66;
      overflow: hidden;
      color: white;
      text-align: center;
      font-family: "Georgia", serif;
    }

    /* Logo flutuante no fundo */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('igrejaFlorida.jpeg') no-repeat center center;
      background-size: 50%;
      opacity: 0.15;
      animation: flutuar 12s ease-in-out infinite alternate;
    }

    @keyframes flutuar {
      from { transform: scale(1); opacity: 0.12; }
      to { transform: scale(1.1); opacity: 0.18; }
    }

    #salmo {
      position: relative;
      font-size: 2rem;
      max-width: 800px;
      text-shadow: 0 0 10px #fff, 0 0 20px #6ec1e4, 0 0 30px #b19cd9;
    }

    /* Botão Próximo */
    #proximo {
      position: fixed;
      bottom: 40px;
      right: 40px;
      display: none;
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      animation: pulsar 1.5s infinite;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    @keyframes pulsar {
      0% { transform: scale(1); box-shadow: 0 0 10px #fff; }
      50% { transform: scale(1.1); box-shadow: 0 0 20px #fff, 0 0 40px #6ec1e4; }
      100% { transform: scale(1); box-shadow: 0 0 10px #fff; }
    }
  </style>
</head>
<body>
  <div id="salmo"></div>
  <button id="proximo" title="Próximo">➡️</button>

  <!-- Música de fundo -->
  <audio id="musica" autoplay loop>
    <source src="https://files.catbox.moe/9x4d7f.mp3" type="audio/mpeg">
    Seu navegador não suporta áudio.
  </audio>

  <script>
    const salmos = [
      "O Senhor é o meu pastor, nada me faltará. (Salmo 23:1)",
      "Entrega o teu caminho ao Senhor; confia nele, e o mais ele fará. (Salmo 37:5)",
      "Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia. (Salmo 46:1)",
      "Bem-aventurado o homem que não anda segundo o conselho dos ímpios. (Salmo 1:1)",
      "O Senhor é a minha luz e a minha salvação; a quem temerei? (Salmo 27:1)",
      "Aquietai-vos e sabei que eu sou Deus. (Salmo 46:10)",
      "Cria em mim, ó Deus, um coração puro e renova em mim um espírito inabalável. (Salmo 51:10)",
      "A tua palavra é lâmpada para os meus pés e luz para o meu caminho. (Salmo 119:105)",
      "O choro pode durar uma noite, mas a alegria vem pela manhã. (Salmo 30:5)",
      "Clama a mim no dia da angústia; eu te livrarei, e tu me glorificarás. (Salmo 50:15)",
      "Os que confiam no Senhor são como o monte Sião, que não se abala, firme para sempre. (Salmo 125:1)",
      "Grandes coisas fez o Senhor por nós, pelas quais estamos alegres. (Salmo 126:3)",
      "Examina-me, Senhor, e prova-me; sonda o meu coração e os meus pensamentos. (Salmo 26:2)",
      "O Senhor é bom, um refúgio em tempos de angústia. Ele protege os que nele confiam. (Salmo 34:8)",
      "Ensina-nos a contar os nossos dias, para que alcancemos coração sábio. (Salmo 90:12)",
      "Sonda-me, ó Deus, e conhece o meu coração; prova-me e conhece as minhas inquietações. (Salmo 139:23)",
      "Espera no Senhor, anima-te, e ele fortalecerá o teu coração. (Salmo 27:14)",
      "O Senhor guarda a tua entrada e a tua saída, desde agora e para sempre. (Salmo 121:8)",
      "Bem-aventurados os que habitam na tua casa; louvam-te perpetuamente. (Salmo 84:4)",
      "Cantai ao Senhor um cântico novo, porque ele tem feito maravilhas. (Salmo 98:1)"
    ];

    function escreverTexto(texto, elemento, callback) {
      let i = 0;
      const intervalo = setInterval(() => {
        elemento.textContent += texto.charAt(i);
        i++;
        if (i === texto.length) {
          clearInterval(intervalo);
          if (callback) callback();
        }
      }, 70);
    }

    window.onload = () => {
      const salmoDiv = document.getElementById("salmo");
      const proximo = document.getElementById("proximo");
      const musica = document.getElementById("musica");

      const index = Math.floor(Math.random() * salmos.length);
      escreverTexto(salmos[index], salmoDiv, () => {
        proximo.style.display = "block";
      });

      proximo.addEventListener("click", () => {
        musica.pause();
        window.location.href = "cashflow.html";
      });
    };
  </script>
</body>
</html>
