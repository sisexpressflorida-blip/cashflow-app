<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Salmo do Dia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: url('./igrejaFlorida.jpeg') no-repeat center center fixed;
      background-size: cover;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.6); /* escurece o fundo para dar contraste */
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen text-white">
  <div class="overlay absolute inset-0"></div>
  
  <div class="relative bg-white bg-opacity-20 backdrop-blur-lg p-6 rounded-2xl shadow-2xl w-96 text-center z-10">
    <h2 class="text-2xl font-bold mb-4">📖 Mensagem do dia</h2>
    <p id="salmo" class="italic text-lg mb-6">Carregando...</p>
    <button onclick="entrar()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-bold">
      Continuar
    </button>
  </div>

  <script>
    const salmos = [
      "O Senhor é o meu pastor, nada me faltará. (Salmo 23:1)",
      "Entrega o teu caminho ao Senhor; confia nele, e o mais ele fará. (Salmo 37:5)",
      "Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia. (Salmo 46:1)",
      "Bem-aventurado o homem que não anda segundo o conselho dos ímpios. (Salmo 1:1)",
      "O Senhor é a minha luz e a minha salvação; a quem temerei? (Salmo 27:1)",
      "Aquietai-vos e sabei que eu sou Deus. (Salmo 46:10)",
      "Cria em mim, ó Deus, um coração puro e renova em mim um espírito inabalável. (Salmo 51:10)",
      "A tua palavra é lâmpada para os meus pés e luz para o meu caminho. (Salmo 119:105)",
      "O choro pode durar uma noite, mas a alegria vem pela manhã. (Salmo 30:5)",
      "Clama a mim no dia da angústia; eu te livrarei, e tu me glorificarás. (Salmo 50:15)",
      "Os que confiam no Senhor são como o monte Sião, que não se abala, firme para sempre. (Salmo 125:1)",
      "Grandes coisas fez o Senhor por nós, pelas quais estamos alegres. (Salmo 126:3)",
      "Examina-me, Senhor, e prova-me; sonda o meu coração e os meus pensamentos. (Salmo 26:2)",
      "O Senhor é bom, um refúgio em tempos de angústia. Ele protege os que nele confiam. (Salmo 34:8)",
      "Ensina-nos a contar os nossos dias, para que alcancemos coração sábio. (Salmo 90:12)",
      "Sonda-me, ó Deus, e conhece o meu coração; prova-me e conhece as minhas inquietações. (Salmo 139:23)",
      "Espera no Senhor, anima-te, e ele fortalecerá o teu coração. (Salmo 27:14)",
      "O Senhor guarda a tua entrada e a tua saída, desde agora e para sempre. (Salmo 121:8)",
      "Bem-aventurados os que habitam na tua casa; louvam-te perpetuamente. (Salmo 84:4)",
      "Cantai ao Senhor um cântico novo, porque ele tem feito maravilhas. (Salmo 98:1)"
    ];

    function carregarSalmo() {
      const index = Math.floor(Math.random() * salmos.length);
      document.getElementById("salmo").textContent = salmos[index];
    }

    function entrar() {
      window.location.href = "cashflow.html"; // redireciona para o dashboard
    }

    carregarSalmo();
  </script>
</body>
</html>
