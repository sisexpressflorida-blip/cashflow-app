<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cashflow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <div class="bg-white p-6 rounded-lg shadow-md w-80 flex flex-col items-center">
    
    <!-- Logo -->
    <img src="./igrejaFlorida.jpeg" alt="Logo" class="w-30 h-30 mb-4 rounded-full shadow-md object-cover">
    
    <!-- Título -->
    <h2 class="text-xl font-bold mb-4 text-center">Login</h2>
    
    <!-- Inputs -->
    <input id="email" type="email" placeholder="Email" class="w-full border p-2 mb-2 rounded">
    <input id="password" type="password" placeholder="Senha" class="w-full border p-2 mb-4 rounded">
    
    <!-- Botão -->
    <button id="loginButton" class="w-full bg-purple-600 text-white py-2 rounded-lg">Entrar</button>
    
    <p id="msg" class="text-red-500 text-sm mt-2"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://mmzadxyalozvrcwovpaj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1temFkeHlhbG96dnJjd292cGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwMTU2MDQsImV4cCI6MjA3MjU5MTYwNH0.U_G9AWD94BILXW82gnz7ngpkoOaTrbunbUpqgikTmBI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById("loginButton").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById("msg").textContent = error.message;
      } else {
        window.location.href = "salmo.html";
      }
    });
  </script>
</body>
</html>
